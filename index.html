<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doodle Jump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#8ed8ff}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,520px);height:100vh;max-height:900px;overflow:hidden;background:linear-gradient(#7fd5ff,#e9f9ff)}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;font-size:20px;color:#17324d;text-shadow:0 2px 0 #fff;pointer-events:none}
#help{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#24465e;font-weight:700;font-size:14px;text-shadow:0 1px #fff;pointer-events:none}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.28);backdrop-filter:blur(2px)}
.card{background:#fff;border:4px solid #17324d;border-radius:22px;padding:28px 26px;text-align:center;box-shadow:0 10px 0 rgba(23,50,77,.18);width:min(88%,360px)}
h1{margin:0 0 8px;font-size:42px;color:#17324d}
p{margin:8px 0 18px;color:#38566b;font-weight:700}
button{border:0;border-radius:14px;background:#ffcf33;color:#17324d;font-weight:900;font-size:20px;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #c69b00}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #c69b00}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud"><span id="score">0 m</span><span id="best">Best: 0</span></div>
<div id="help">← → or A D to move • land on platforms</div>
<div id="overlay">
  <div class="card">
    <h1 id="title">DOODLE JUMP</h1>
    <p id="message">Keep jumping higher. Don't fall!</p>
    <button id="start">START</button>
  </div>
</div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'),title=document.getElementById('title'),message=document.getElementById('message'),startBtn=document.getElementById('start');

let W=0,H=0,dpr=1,raf=0,last=0,running=false,score=0,best=Number(localStorage.doodleBest||0);
let player,platforms,enemies,cameraY,keys={left:false,right:false},particles=[],invuln=0;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=canvas.clientWidth; H=canvas.clientHeight;
 canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);resize();bestEl.textContent='Best: '+best+' m';

function reset(){
 score=0;cameraY=0;particles=[];enemies=[];invuln=0;
 player={x:W/2-17,y:H-130,w:34,h:42,vx:0,vy:0};
 platforms=[{x:W/2-55,y:H-70,w:110,h:14,type:'normal',vx:0}];
 let y=H-145;
 while(y>-700){addPlatform(y);y-=64+Math.random()*20;}
}

function addPlatform(y){
 const difficulty=Math.min(score/1400,1);
 const w=Math.max(34,96-difficulty*58+Math.random()*10);
 const base=platforms.length?platforms[platforms.length-1]:null;
 let x;
 if(base){
   const center=base.x+base.w/2;
   const maxShift=90+difficulty*125;
   const desired=center+(Math.random()-.5)*maxShift*2;
   x=Math.max(4,Math.min(W-w-4,desired-w/2));
 }else{
   x=(W-w)/2;
 }
 const moving=score>220 && Math.random()<(0.12+difficulty*0.28);
 if(score>180 && Math.random()<.22){ enemies.push({x:Math.random()*(W-34),y:y-34,w:34,h:28,vx:Math.random()<.5?-55:55}); }
 platforms.push({x,y,w,h:13,type:moving?'moving':'normal',vx:moving?(Math.random()<.5?-30:30):0});
}

function startGame(){
 reset();running=true;overlay.classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function gameOver(){
 running=false;
 if(score>best){best=Math.floor(score);localStorage.doodleBest=best;bestEl.textContent='Best: '+best+' m';}
 title.textContent='GAME OVER';message.textContent='You reached '+Math.floor(score)+' m';startBtn.textContent='PLAY AGAIN';overlay.classList.remove('hidden');
}

startBtn.onclick=startGame;
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','a','d','A','D',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
 if(e.key===' '&&!running)startGame();
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
});

function jump(){
 player.vy=-680;
 for(let i=0;i<7;i++)particles.push({x:player.x+player.w/2,y:player.y+player.h,vx:(Math.random()-.5)*90,vy:Math.random()*80,life:.35});
}

function update(dt){
 invuln=Math.max(0,invuln-dt);
 const accel=1700,maxSpeed=310;
 if(keys.left)player.vx-=accel*dt;
 if(keys.right)player.vx+=accel*dt;
 if(!keys.left&&!keys.right)player.vx*=Math.pow(.001,dt);
 player.vx=Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));
 player.x+=player.vx*dt;
 if(player.x>W)player.x=-player.w;
 if(player.x+player.w<0)player.x=W;
 const oldBottom=player.y+player.h;
 player.vy+=1850*dt; player.y+=player.vy*dt;

 for(const e of enemies){
 e.x+=e.vx*dt;
 if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
 if(e.x+e.w>W){e.x=W-e.w;e.vx=-Math.abs(e.vx);}
 if(invuln<=0 && player.x+player.w>e.x+5 && player.x<e.x+e.w-5 && player.y+player.h>e.y+4 && player.y<e.y+e.h){
   player.vy=-420;
   player.y=e.y-player.h;
   player.vx += (player.x < e.x ? -220 : 220);
   invuln=1.0;
   player.hitFlash=0.18;
 }
}
for(const p of platforms){ if(p.fragile && p.breakTimer>0){ p.breakTimer+=dt; if(p.breakTimer>.28){p.y=9999;} }
   if(p.type==='moving'){p.x+=p.vx*dt;if(p.x<0||p.x+p.w>W)p.vx*=-1;}
   if(player.vy>0 && oldBottom<=p.y && player.y+player.h>=p.y &&
      player.x+player.w>p.x && player.x<p.x+p.w){player.y=p.y-player.h;jump();}
 }

 const target=H*.38;
 if(player.y<target){
   const shift=target-player.y;player.y=target;
   cameraY+=shift;score+=shift*.055;
   for(const p of platforms)p.y+=shift;
   for(const e of enemies)e.y+=shift;
   for(const q of particles)q.y+=shift;
 }
 while(platforms.length && platforms[0].y>H+120)platforms.shift();
 while(enemies.length && enemies[0].y>H+180)enemies.shift();
 let top=Math.min(...platforms.map(p=>p.y));
 while(top>-180){const gap=62+difficulty*58+Math.random()*(20+difficulty*28);top-=gap;addPlatform(top);}
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=300*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1);}
 if(player.hitFlash>0)player.hitFlash-=dt;
 if(player.y>H+90)gameOver();
 scoreEl.textContent=Math.floor(score)+' m';
}

function cloud(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(255,255,255,.78)';
 ctx.beginPath();ctx.arc(0,8,20,0,Math.PI*2);ctx.arc(25,0,27,0,Math.PI*2);ctx.arc(55,10,18,0,Math.PI*2);ctx.fill();ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#8edbff';ctx.fillRect(0,0,W,H);
 cloud(35,80,.8);cloud(W-120,170,.65);cloud(W*.35,300,.55);cloud(70,500,.7);
 for(const e of enemies){
   if(e.y<-80||e.y>H+80)continue;
   ctx.fillStyle='#d94b4b';ctx.beginPath();ctx.roundRect?ctx.roundRect(e.x,e.y,e.w,e.h,8):ctx.rect(e.x,e.y,e.w,e.h);ctx.fill();
   ctx.fillStyle='#fff';ctx.fillRect(e.x+7,e.y+7,6,6);ctx.fillRect(e.x+21,e.y+7,6,6);
   ctx.fillStyle='#222';ctx.fillRect(e.x+9,e.y+9,3,3);ctx.fillRect(e.x+23,e.y+9,3,3);
 }
 for(const p of platforms){
   ctx.fillStyle=p.type==='moving'?'#ff9f43':'#55b95b';
   if(p.fragile && p.breakTimer>0){ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.rotate(Math.sin(p.breakTimer*55)*.06);ctx.globalAlpha=Math.max(0,1-p.breakTimer/0.28);ctx.translate(-(p.x+p.w/2),-(p.y+p.h/2));} ctx.fillRect(p.x,p.y,p.w,p.h); if(p.fragile && p.breakTimer>0){ctx.globalAlpha=1;ctx.restore();}
   ctx.fillStyle=p.type==='moving'?'#ffd166':'#8be28d';ctx.fillRect(p.x,p.y,p.w,4);
 }
 for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/.35);ctx.fillStyle='#fff';ctx.fillRect(q.x,q.y,5,5);ctx.globalAlpha=1;}
 if(player){
   const x=player.x,y=player.y;
   if(player.hitFlash>0 && Math.floor(player.hitFlash*20)%2===0) ctx.globalAlpha=.35;
   ctx.fillStyle='#62d84e';ctx.beginPath();ctx.ellipse(x+17,y+22,17,20,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+10,y+14,6,0,Math.PI*2);ctx.arc(x+24,y+14,6,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#17324d';ctx.beginPath();ctx.arc(x+11,y+15,2.5,0,Math.PI*2);ctx.arc(x+23,y+15,2.5,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#17324d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+17,y+22,8,0.15,Math.PI-.15);ctx.stroke();
   ctx.fillStyle='#55aef5';ctx.fillRect(x+2,y+35,12,6);ctx.fillRect(x+20,y+35,12,6);
   ctx.globalAlpha=1;
 }
}
function loop(t){
 if(!running)return;const dt=Math.min(.022,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop);
}
reset();draw();
</script>
</body>
</html>
